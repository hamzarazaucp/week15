name: wfci-development
on:
  pull_request: 
    branches: 
      - develop
jobs:
  ci-development-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositry
        uses: actions/checkout@v4
      - name: Lint HTML and CSS
        run: |
          npx htmlhint "**/*.html"  
          npx stylelint "**/*.css"
      - name:
        run: |
           npx parcel build "./src/index.html" --dist-dir "./dev" --public-url "./" 